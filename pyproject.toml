[build-system]
requires = [
    "hatchling>=1.10.0",
    "hatch-nodejs-version>=0.3.0",
]
build-backend = "hatchling.build"

[project]
name = "k3d"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "Jupyter",
    "JupyterLab",
    "anywidget",
]
classifiers = [
    "Framework :: Jupyter",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anywidget>=0.9.13",
    "ipywidgets>=7.6.0,<9.0.0",
    "msgpack",
    "deepcomparer",
    "numpy",
    "traitlets",
    "traittypes",
]
dynamic = ["version", "description", "authors", "urls"]

[project.optional-dependencies]
dev = [
    "build",
    "flask",
    "jupyterlab",
    "notebook",
    "pixelmatch",
    "pytest",
    "pytest-notebook",
    "pytest-cov",
    "selenium",
    "webdriver_manager"
]
# these cover all packages necessary to run the notebooks in `examples/`
examples = [
    "flask",
    "matplotlib",
    "mdutils",
    "nibabel",
    "numba",
    "opencv-python",
    "pyunpack",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "tqdm",
    "vtk"
]

[dependency-groups]
docs = [
    "ipywidgets>=7.0.1",
    "traittypes",
    "traitlets",
    "numpy",
    "jupyter_sphinx",
    "pydata_sphinx_theme",
    "pyvista",
    "SimpleITK",
    "sphinx-copybutton",
]

[project.license]
file = "LICENSE.txt"

[tool.hatch.build.targets.wheel]
exclude = ["k3d/test", "k3d/*.stl"]
artifacts = [
    "k3d/static/widget.mjs",
    "k3d/static/widget.mjs.LICENSE.txt",
    "k3d/static/standalone.js",
    "k3d/static/standalone.js.LICENSE.txt",
    "k3d/static/headless.html",
    "k3d/static/snapshot_standalone.txt",
    "k3d/static/snapshot_online.txt",
    "k3d/static/snapshot_inline.txt",
    "k3d/static/require.js",
    "k3d/static/require.js.LICENSE.txt",
    "k3d/static/fflate.js",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    "docs",
    "imgs",
    "k3d/test",
    "examples",
    "binder",
]
artifacts = [
    "k3d/static/widget.mjs",
    "k3d/static/widget.mjs.LICENSE.txt",
    "k3d/static/standalone.js",
    "k3d/static/standalone.js.LICENSE.txt",
    "k3d/static/headless.html",
    "k3d/static/snapshot_standalone.txt",
    "k3d/static/snapshot_online.txt",
    "k3d/static/snapshot_inline.txt",
    "k3d/static/require.js",
    "k3d/static/require.js.LICENSE.txt",
    "k3d/static/fflate.js",
]

[tool.hatch.build.hooks.jupyter-builder]
# widget.mjs is the anywidget front-end module, standalone.js feeds snapshots,
# headless and docs - both are real webpack outputs, not files from the source tree
ensured-targets = [
    "k3d/static/widget.mjs",
    "k3d/static/standalone.js",
]
skip-if-exists = ["k3d/static/widget.mjs"]
dependencies = [
    "hatch-jupyter-builder>=0.6.2",
]
build-function = "hatch_jupyter_builder.npm_builder"

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "."
build_cmd = "build:prod"
npm = [
    "npm",
]
