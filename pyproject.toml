[build-system]
requires = [
    # 1.27 is the first with PEP 639 support, which `license`/`license-files` below need
    "hatchling>=1.27.0",
    "hatch-nodejs-version>=0.3.0",
]
build-backend = "hatchling.build"

[project]
name = "k3d"
readme = "README.md"
requires-python = ">=3.9"
# Static: hatch-nodejs-version supplies only `version`, and package.json's homepage is a
# git clone URL. Declared dynamic with no hook is what left these null on PyPI.
description = "WebGL 3D plotting for Jupyter: meshes, isosurfaces, volumes, voxels and point clouds"
# SPDX expression, not [project.license].file: the file form puts the whole MIT text in the
# License metadata field, which PyPI renders verbatim instead of as a licence chip
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
    "Jupyter",
    "JupyterLab",
    "anywidget",
    "3d",
    "webgl",
    "visualization",
    "volume-rendering",
    "point-cloud",
    "numpy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    # not `... JupyterLab :: Extensions`: since 3.0.0 there is no extension to enable
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # stops at 3.12: that is what test.yml runs
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anywidget>=0.9.13",
    "ipywidgets>=7.6.0,<9.0.0",
    "msgpack",
    "deepcomparer",
    "numpy",
    "traitlets",
    "traittypes",
]
dynamic = ["version"]

[[project.authors]]
name = "k3d team"
email = "artur.trzesiok@gmail.com"

[project.urls]
Documentation = "https://k3d-jupyter.org"
Homepage = "https://k3d-jupyter.org"
Source = "https://github.com/K3D-tools/K3D-jupyter"
Issues = "https://github.com/K3D-tools/K3D-jupyter/issues"
Changelog = "https://github.com/K3D-tools/K3D-jupyter/releases"

[project.optional-dependencies]
dev = [
    "build",
    "flask",
    "jupyterlab",
    "notebook",
    "pixelmatch",
    "ruff",
    "pytest",
    "pytest-notebook",
    "pytest-cov",
    "selenium",
    "webdriver_manager"
]
# these cover all packages necessary to run the notebooks in `examples/`
examples = [
    "flask",
    "matplotlib",
    "mdutils",
    "nibabel",
    "numba",
    "opencv-python",
    "pyunpack",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "tqdm",
    "vtk"
]


[tool.hatch.build.targets.wheel]
exclude = ["k3d/test", "k3d/*.stl"]
artifacts = [
    "k3d/static/widget.mjs",
    "k3d/static/widget.mjs.LICENSE.txt",
    "k3d/static/standalone.js",
    "k3d/static/standalone.js.LICENSE.txt",
    "k3d/static/k3d-bvh-worker.mjs",
    "k3d/static/k3d-bvh-worker.mjs.LICENSE.txt",
    "k3d/static/k3d-bvh-worker.js",
    "k3d/static/k3d-bvh-worker.js.LICENSE.txt",
    "k3d/static/headless.html",
    "k3d/static/snapshot_standalone.txt",
    "k3d/static/snapshot_online.txt",
    "k3d/static/snapshot_inline.txt",
    "k3d/static/require.js",
    "k3d/static/require.js.LICENSE.txt",
    "k3d/static/fflate.js",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    "docs",
    "imgs",
    "k3d/test",
    "examples",
]
artifacts = [
    "k3d/static/widget.mjs",
    "k3d/static/widget.mjs.LICENSE.txt",
    "k3d/static/standalone.js",
    "k3d/static/standalone.js.LICENSE.txt",
    "k3d/static/k3d-bvh-worker.mjs",
    "k3d/static/k3d-bvh-worker.mjs.LICENSE.txt",
    "k3d/static/k3d-bvh-worker.js",
    "k3d/static/k3d-bvh-worker.js.LICENSE.txt",
    "k3d/static/headless.html",
    "k3d/static/snapshot_standalone.txt",
    "k3d/static/snapshot_online.txt",
    "k3d/static/snapshot_inline.txt",
    "k3d/static/require.js",
    "k3d/static/require.js.LICENSE.txt",
    "k3d/static/fflate.js",
]

[tool.hatch.build.hooks.jupyter-builder]
# widget.mjs is the anywidget front-end module, standalone.js feeds snapshots,
# headless and docs - both are real webpack outputs, not files from the source tree
ensured-targets = [
    "k3d/static/widget.mjs",
    "k3d/static/standalone.js",
]
skip-if-exists = ["k3d/static/widget.mjs"]
dependencies = [
    "hatch-jupyter-builder>=0.6.2",
]
build-function = "hatch_jupyter_builder.npm_builder"

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "."
build_cmd = "build:prod"
npm = [
    "npm",
]

[tool.ruff]
# 120 to match max-len in js/.eslintrc.js - one limit for both languages
line-length = 120
# matches requires-python; raise both together
target-version = "py39"
# an archived copy of the 2.1.0 test notebook, not maintained code
extend-exclude = ["examples/old"]

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), import order (I), bugbear (B), comprehensions (C4),
# returns (RET), simplifications (SIM) and pyupgrade (UP). Left out on purpose:
#   N    - pep8-naming would rename matrix variables (T, Rx) and public class names
#   PTH  - ~150 os.path -> pathlib rewrites with no functional gain
#   ARG  - unused arguments are usually interface conformance across object providers
# RUF100 catches a `# noqa` that has outlived its rule - the same kind of rot that let a
# stale 3.7 guard sit here unnoticed. BLE (blind-except) was tried and dropped: all eight
# `except Exception` in the package are deliberate, commented fallbacks.
select = ["E", "F", "W", "I", "B", "C4", "RET", "RUF100", "SIM", "UP"]
ignore = [
    # typing.Dict -> dict and the matching imports: 174 annotations, a mechanical
    # sweep that belongs in its own change rather than in a release
    "UP006",
    "UP035",
    # %-formatting -> f-strings: 100 call sites, no functional gain
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
# sys.path has to be extended before k3d is importable from a source checkout, so these
# imports cannot come first
"k3d/test/conftest.py" = ["E402"]
# B006: origin is rebound by np.array() and boundary is only indexed, so neither mutable
# default can leak; None would hide the real default from help() and the API reference
"k3d/platonic.py" = ["B006"]
"k3d/helpers.py" = ["B006"]
# Notebook conventions, not module conventions: cells re-import and redefine on purpose, a
# stray import is often there for its side effect, and F821 is unusable because ruff does not
# parse the statement after an IPython magic - all five hits are `%time x = ...`.
"examples/**/*.ipynb" = [
    "B007", "B018", "C408", "C417", "E402", "E501", "E702", "E703", "E731", "E741",
    "F401", "F811", "F821", "I001", "SIM115", "SIM118", "UP004", "UP015", "W291", "W293",
]
