services :
  k3d-build :
    image : k3d-build:latest
    container_name : k3d-build
    build :
      dockerfile : Dockerfile
      context : .
    volumes :
      - ./:/opt/app/src:delegated
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
