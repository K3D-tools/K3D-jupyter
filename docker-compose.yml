services :
  k3d-build :
    image : k3d-build:latest
    container_name : k3d-build
    build :
      dockerfile : Dockerfile
      context : .
    # Docker gives a container 64 MB of /dev/shm, which one Chrome at 1280x720 just fits and
    # two do not: the second renderer dies and its canvas comes back blank, which reads as every
    # visual test failing rather than as running out of shared memory. pytest -n needs the room.
    shm_size : 2gb
    volumes :
      - ./:/opt/app/src:delegated
    ports :
      # `docker compose run` publishes nothing unless --service-ports is passed, and jupyter has
      # to bind 0.0.0.0 to be reachable through the mapping:
      #   docker compose run --rm --service-ports k3d-build bash
      #   jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser
      #   docker compose stop k3d-build
      - "8888:8888"
      - "9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
