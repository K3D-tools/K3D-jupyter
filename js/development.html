<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>K3D</title>
  <script src="node_modules/requirejs/require.js"></script>
  <script src="dist/standalone.js?k3d"></script>
  <style>
    body, html {
      background-color: #F5F5F5;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #canvasTarget {
      width: 100%;
      height: 100%;
      position: absolute;
    }
  </style>
</head>
<body>
<div id="canvasTarget"></div>
<script>
  var K3DInstance;

  function fileLoader(url, callback) {
    var xhrLoad = new XMLHttpRequest();
    xhrLoad.responseType = "arraybuffer";
    xhrLoad.open('GET', url, true);

    xhrLoad.onreadystatechange = function () {
      if (xhrLoad.readyState === 4) {
        callback(xhrLoad.response);
      }
    };

    xhrLoad.send(null);
  }

  require(['k3d'], function (lib) {

    // try {
    //   K3DInstance = new lib.K3D(
    //     lib.ThreeJsProvider,
    //     document.getElementById('canvasTarget'),
    //   );
    // } catch (e) {
    //   console.log(e);
    //   return reject(e);
    // }

    fileLoader('dump.k3d', function (data) {
      K3DInstance = lib.CreateK3DAndLoadBinarySnapshot(
        data,
        document.getElementById('canvasTarget')
      ).then(function (ret) {
        K3DInstance = ret;

        K3DInstance.setFpsMeter(true);

        var frame = 0;
        var initialTime = performance.now();
        var framesSinceRotation = 0;
        var rotationIndex = 0;
        var twoPi = Math.PI * 2;
        
        function rotate() {
            var time = (performance.now() - initialTime) * 0.001;
            var radius = 250.0;
            
            var x = Math.sin(time) * radius;
            var y = Math.cos(time) * radius;
            var z = 1.0;

            if (K3DInstance) {
                K3DInstance.setCamera([x, y, z, 0.5, 0.5, 0.5, 0, 0, 1]);
            }
            
            var currentRotationIndex = Math.floor(time / twoPi);
            if (currentRotationIndex !== rotationIndex) {
                var rotationsCompleted = currentRotationIndex - rotationIndex;
                var durationMs = rotationsCompleted * twoPi * 1000;
                console.log("FPS (full rotation): " + (framesSinceRotation * 1000 / durationMs).toFixed(2));
                rotationIndex = currentRotationIndex;
                framesSinceRotation = 0;
            }

            frame++;
            framesSinceRotation++;
            
            requestAnimationFrame(rotate);
        }
        
        // rotate();

        // K3DInstance.on(K3DInstance.events.OBJECT_HOVERED, (params) => {
        //   console.log(params);
        // });

        // setTimeout(function () {
        //   let jsons = ret.getWorld().ObjectsListJson;
        
        //   Object.keys(jsons).forEach(function(id) {
        //     jsons[id].samples = 10000;
        //     jsons[id].shadow = 'off';
        //     K3DInstance.reload(jsons[id]);
        //   });
        // }, 500);
      });
    });
  });
</script>
</body>
</html>
